name: Publish CRFM 0.3 preview

on:
  push:
    branches:
      - crfm-0.3
    paths:
      - index.html
      - .github/workflows/publish-crfm-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crfm-preview-publisher
  cancel-in-progress: false

jobs:
  publish-preview:
    name: Sync candidate to main/preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v4
        with:
          ref: crfm-0.3
          path: candidate
          persist-credentials: false

      - name: Checkout Pages source branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: pages
          persist-credentials: true
          fetch-depth: 0

      - name: Publish preview without touching production
        working-directory: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p preview
          cp ../candidate/index.html preview/index.html
          if git diff --quiet -- preview/index.html; then
            echo "Preview already matches the candidate."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- preview/index.html
          git commit -m "Sync CRFM 0.3 candidate into preview"
          git push origin HEAD:main
