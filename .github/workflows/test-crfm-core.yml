name: CRFM headless core tests
on:
  push:
    branches: [crfm-0.3]
    paths:
      - 'core/**'
      - 'package.json'
      - '.github/workflows/test-crfm-core.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run headless spatial invariants
        run: npm test
